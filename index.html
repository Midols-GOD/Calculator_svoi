<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор стенки — расчёт штукатурки, покраски и материалов</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #f8fafc;
            color: #0f172a;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .action-btn.active {
            border-color: #ea580c;
            background-color: #fff7ed;
            box-shadow: 0 4px 12px rgba(234, 88, 12, 0.12);
        }
        input[type="number"]::-webkit-inner-spin-button {
            opacity: 1;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- ШАПКА -->
    <header class="bg-slate-900 text-white py-5 px-4 border-b border-slate-800">
        <div class="max-w-3xl mx-auto flex items-center justify-between gap-3">
            <div>
                <h1 class="text-xl sm:text-2xl font-black tracking-tight">Калькулятор стенки</h1>
                <p class="text-xs sm:text-sm text-slate-400 mt-0.5">Введите размер стенки и выберите, что хотите сделать</p>
            </div>
            <div class="text-xs font-bold px-3 py-1.5 rounded-lg bg-slate-800 text-orange-400 border border-slate-700">
                Стена
            </div>
        </div>
    </header>

    <!-- ОСНОВНОЙ БЛОК -->
    <main class="max-w-3xl mx-auto w-full px-4 py-6 flex-1 space-y-6">

        <!-- ШАГ 1: РАЗМЕР СТЕНКИ -->
        <section class="bg-white rounded-2xl p-5 sm:p-6 shadow-sm border border-slate-200">
            <div class="flex items-center justify-between gap-2 mb-4">
                <h2 class="text-base sm:text-lg font-extrabold text-slate-900">1. Размер стенки</h2>
                <button type="button" onclick="resetWall()" class="text-xs font-bold text-orange-600 hover:underline cursor-pointer">
                    Сбросить
                </button>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <div>
                    <label for="wallWidth" class="block text-xs font-bold text-slate-600 mb-1.5">Ширина / длина стенки (м)</label>
                    <input type="number" id="wallWidth" value="4.0" min="0.1" step="0.1" oninput="calculateWall()"
                        class="w-full rounded-xl border border-slate-300 px-3.5 py-2.5 text-sm font-bold text-slate-900 focus:border-orange-500 focus:outline-none">
                </div>
                <div>
                    <label for="wallHeight" class="block text-xs font-bold text-slate-600 mb-1.5">Высота стенки (м)</label>
                    <input type="number" id="wallHeight" value="2.7" min="0.1" step="0.05" oninput="calculateWall()"
                        class="w-full rounded-xl border border-slate-300 px-3.5 py-2.5 text-sm font-bold text-slate-900 focus:border-orange-500 focus:outline-none">
                </div>
                <div>
                    <label for="wallReserve" class="block text-xs font-bold text-slate-600 mb-1.5">Запас на потери (%)</label>
                    <select id="wallReserve" onchange="calculateWall()"
                        class="w-full rounded-xl border border-slate-300 bg-white px-3.5 py-2.5 text-sm font-bold text-slate-900 focus:border-orange-500 focus:outline-none">
                        <option value="0">0%</option>
                        <option value="5">5%</option>
                        <option value="10" selected>10% (обычный запас)</option>
                        <option value="15">15%</option>
                    </select>
                </div>
            </div>

            <div class="mt-4 pt-3.5 border-t border-slate-100 flex items-center justify-between text-xs sm:text-sm">
                <span class="text-slate-500 font-semibold">Площадь стенки:</span>
                <span id="areaDisplay" class="font-black text-slate-900">10.80 м²</span>
            </div>
        </section>

        <!-- ШАГ 2: ЧТО ХОТИМ СДЕЛАТЬ СО СТЕНКОЙ -->
        <section class="bg-white rounded-2xl p-5 sm:p-6 shadow-sm border border-slate-200">
            <h2 class="text-base sm:text-lg font-extrabold text-slate-900 mb-4">2. Что делаем со стенкой?</h2>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
                <button type="button" id="btnPlaster" onclick="selectAction('plaster')"
                    class="action-btn active text-left p-4 rounded-xl border-2 border-slate-200 bg-white transition cursor-pointer">
                    <div class="font-extrabold text-sm sm:text-base text-slate-900">Поштукатурить</div>
                    <div class="text-xs text-slate-500 mt-1">Выровнять стенку штукатурным раствором</div>
                </button>

                <button type="button" id="btnPaint" onclick="selectAction('paint')"
                    class="action-btn text-left p-4 rounded-xl border-2 border-slate-200 bg-white transition cursor-pointer">
                    <div class="font-extrabold text-sm sm:text-base text-slate-900">Покрасить</div>
                    <div class="text-xs text-slate-500 mt-1">Покрыть стенку краской в 2 слоя</div>
                </button>
            </div>

            <!-- Дополнительный параметр под выбранное действие -->
            <div id="plasterOptions" class="mt-4 pt-4 border-t border-slate-100">
                <label for="plasterMm" class="block text-xs font-bold text-slate-600 mb-1.5">Примерная толщина слоя штукатурки (мм)</label>
                <input type="number" id="plasterMm" value="10" min="1" max="100" step="1" oninput="calculateWall()"
                    class="w-full sm:w-56 rounded-xl border border-slate-300 px-3.5 py-2 text-sm font-bold text-slate-900 focus:border-orange-500 focus:outline-none">
            </div>

            <div id="paintOptions" class="hidden mt-4 pt-4 border-t border-slate-100">
                <label for="paintCoats" class="block text-xs font-bold text-slate-600 mb-1.5">Количество слоёв краски</label>
                <select id="paintCoats" onchange="calculateWall()"
                    class="w-full sm:w-56 rounded-xl border border-slate-300 bg-white px-3.5 py-2 text-sm font-bold text-slate-900 focus:border-orange-500 focus:outline-none">
                    <option value="1">1 слой</option>
                    <option value="2" selected>2 слоя (стандарт)</option>
                    <option value="3">3 слоя</option>
                </select>
            </div>
        </section>

        <!-- ШАГ 3: РЕЗУЛЬТАТ -->
        <section class="bg-slate-900 text-white rounded-2xl p-5 sm:p-6 shadow-lg border border-slate-800">
            <div class="text-xs uppercase tracking-wider font-bold text-orange-400 mb-1">Результат расчёта</div>
            <h2 id="resultTitle" class="text-xl sm:text-2xl font-black mb-4">Сколько нужно штукатурки</h2>

            <div class="bg-slate-800/90 rounded-xl p-4 sm:p-5 border border-slate-700 mb-4">
                <div class="text-xs text-slate-400 mb-1" id="resultMainLabel">Примерный объём раствора:</div>
                <div id="resultMainValue" class="text-3xl sm:text-4xl font-black text-orange-400">0 л</div>
                <div id="resultSubNote" class="text-xs sm:text-sm text-slate-300 mt-2 leading-relaxed"></div>
            </div>

            <button type="button" id="copyResultBtn" onclick="copyResult()"
                class="w-full py-3 rounded-xl bg-orange-600 hover:bg-orange-500 text-white font-extrabold text-sm transition cursor-pointer">
                Скопировать результат
            </button>
        </section>
    </main>

    <footer class="bg-slate-900 text-slate-400 text-xs py-4 px-4 mt-8 border-t border-slate-800 text-center">
        Калькулятор стенки — быстрый ориентировочный расчёт материалов
    </footer>

    <script>
        let currentAction = 'plaster';

        function selectAction(action) {
            currentAction = action;
            document.getElementById('btnPlaster').className = action === 'plaster'
                ? 'action-btn active text-left p-4 rounded-xl border-2 border-slate-200 bg-white transition cursor-pointer'
                : 'action-btn text-left p-4 rounded-xl border-2 border-slate-200 bg-white transition cursor-pointer';
            document.getElementById('btnPaint').className = action === 'paint'
                ? 'action-btn active text-left p-4 rounded-xl border-2 border-slate-200 bg-white transition cursor-pointer'
                : 'action-btn text-left p-4 rounded-xl border-2 border-slate-200 bg-white transition cursor-pointer';

            document.getElementById('plasterOptions').classList.toggle('hidden', action !== 'plaster');
            document.getElementById('paintOptions').classList.toggle('hidden', action !== 'paint');

            calculateWall();
        }

        function resetWall() {
            document.getElementById('wallWidth').value = 4.0;
            document.getElementById('wallHeight').value = 2.7;
            document.getElementById('wallReserve').value = 10;
            document.getElementById('plasterMm').value = 10;
            document.getElementById('paintCoats').value = 2;
            calculateWall();
        }

        function calculateWall() {
            const w = Math.max(0.1, parseFloat(document.getElementById('wallWidth').value) || 0);
            const h = Math.max(0.1, parseFloat(document.getElementById('wallHeight').value) || 0);
            const reservePct = parseFloat(document.getElementById('wallReserve').value) || 0;

            const netArea = w * h;
            const totalArea = netArea * (1 + reservePct / 100);

            document.getElementById('areaDisplay').textContent = `${netArea.toFixed(2)} м²`;

            if (currentAction === 'plaster') {
                const mm = Math.max(1, parseFloat(document.getElementById('plasterMm').value) || 10);
                // Объём слоя в литрах: площадь (м²) * толщина (м) * 1000 л/м³ = площадь * мм
                const liters = totalArea * mm;
                // Ориентировочный вес сухой смеси (~1.1 кг на 1 мм на 1 м²)
                const kg = totalArea * mm * 1.1;
                const bags30 = Math.max(1, Math.ceil(kg / 30));

                document.getElementById('resultTitle').textContent = 'Сколько нужно штукатурки';
                document.getElementById('resultMainLabel').textContent = 'Примерный объём штукатурки (в литрах):';
                document.getElementById('resultMainValue').textContent = `≈ ${liters.toFixed(1)} л`;
                document.getElementById('resultSubNote').textContent =
                    `На стенку ${netArea.toFixed(2)} м² (с запасом ${reservePct}%) при слое ${mm} мм: около ${kg.toFixed(1)} кг сухой смеси (≈ ${bags30} мешк. по 30 кг).`;
            } else {
                const coats = parseInt(document.getElementById('paintCoats').value, 10) || 2;
                // Средний расход краски ~0.12 л/м² за один слой
                const liters = totalArea * 0.12 * coats;

                document.getElementById('resultTitle').textContent = 'Сколько нужно краски';
                document.getElementById('resultMainLabel').textContent = 'Примерный объём краски (в литрах):';
                document.getElementById('resultMainValue').textContent = `≈ ${liters.toFixed(1)} л`;
                document.getElementById('resultSubNote').textContent =
                    `На стенку ${netArea.toFixed(2)} м² (с запасом ${reservePct}%) в ${coats} сл. при среднем расходе ~0.12 л/м² за слой.`;
            }
        }

        function copyResult() {
            const title = document.getElementById('resultTitle').textContent;
            const val = document.getElementById('resultMainValue').textContent;
            const note = document.getElementById('resultSubNote').textContent;
            const text = `${title}: ${val}
${note}`;

            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text);
            } else {
                const ta = document.createElement('textarea');
                ta.value = text;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
            }

            const btn = document.getElementById('copyResultBtn');
            const oldText = btn.textContent;
            btn.textContent = 'Скопировано!';
            setTimeout(() => { btn.textContent = oldText; }, 1800);
        }

        calculateWall();
    </script>
</body>
</html>
