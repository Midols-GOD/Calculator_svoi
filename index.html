<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор ремонта — стена, пол и потолок по этапам</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #f8fafc;
            color: #0f172a;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .surface-tab.active {
            background-color: #ea580c;
            color: #ffffff;
            border-color: #ea580c;
        }
        .action-btn.active {
            border-color: #ea580c;
            background-color: #fff7ed;
            box-shadow: 0 4px 12px rgba(234, 88, 12, 0.12);
        }
        input[type="number"]::-webkit-inner-spin-button {
            opacity: 1;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- ШАПКА -->
    <header class="bg-slate-900 text-white py-5 px-4 border-b border-slate-800">
        <div class="max-w-3xl mx-auto flex items-center justify-between gap-3">
            <div>
                <h1 class="text-xl sm:text-2xl font-black tracking-tight">Калькулятор ремонта</h1>
                <p class="text-xs sm:text-sm text-slate-400 mt-0.5">Стена, пол и потолок — отдельные блоки под каждый этап от голых стен до жилой комнаты</p>
            </div>
            <div id="headerBadge" class="text-xs font-bold px-3 py-1.5 rounded-lg bg-slate-800 text-orange-400 border border-slate-700">
                Стена
            </div>
        </div>
    </header>

    <!-- ОСНОВНОЙ БЛОК -->
    <main class="max-w-3xl mx-auto w-full px-4 py-6 flex-1 space-y-6">

        <!-- ШАГ 1: ВЫБОР ПОВЕРХНОСТИ И РАЗМЕРЫ -->
        <section class="bg-white rounded-2xl p-5 sm:p-6 shadow-sm border border-slate-200">
            <div class="flex items-center justify-between gap-2 mb-3">
                <h2 class="text-base sm:text-lg font-extrabold text-slate-900">1. Что считаем и размер</h2>
                <button type="button" onclick="resetCurrent()" class="text-xs font-bold text-orange-600 hover:underline cursor-pointer">
                    Сбросить
                </button>
            </div>

            <!-- Переключатель поверхности -->
            <div class="grid grid-cols-3 gap-2 mb-5">
                <button type="button" id="tabWall" onclick="selectSurface('wall')"
                    class="surface-tab active py-2.5 px-3 rounded-xl border border-slate-300 text-xs sm:text-sm font-extrabold transition cursor-pointer">
                    Стена
                </button>
                <button type="button" id="tabFloor" onclick="selectSurface('floor')"
                    class="surface-tab py-2.5 px-3 rounded-xl border border-slate-300 text-xs sm:text-sm font-extrabold text-slate-700 bg-white transition cursor-pointer">
                    Пол
                </button>
                <button type="button" id="tabCeiling" onclick="selectSurface('ceiling')"
                    class="surface-tab py-2.5 px-3 rounded-xl border border-slate-300 text-xs sm:text-sm font-extrabold text-slate-700 bg-white transition cursor-pointer">
                    Потолок
                </button>
            </div>

            <!-- Поля размеров -->
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <div>
                    <label id="lblDimA" for="dimA" class="block text-xs font-bold text-slate-600 mb-1.5">Ширина / длина стенки (м)</label>
                    <input type="number" id="dimA" value="4.0" min="0.1" step="0.1" oninput="calculate()"
                        class="w-full rounded-xl border border-slate-300 px-3.5 py-2.5 text-sm font-bold text-slate-900 focus:border-orange-500 focus:outline-none">
                </div>
                <div>
                    <label id="lblDimB" for="dimB" class="block text-xs font-bold text-slate-600 mb-1.5">Высота стенки (м)</label>
                    <input type="number" id="dimB" value="2.7" min="0.1" step="0.05" oninput="calculate()"
                        class="w-full rounded-xl border border-slate-300 px-3.5 py-2.5 text-sm font-bold text-slate-900 focus:border-orange-500 focus:outline-none">
                </div>
                <div>
                    <label for="reservePct" class="block text-xs font-bold text-slate-600 mb-1.5">Запас на потери (%)</label>
                    <select id="reservePct" onchange="calculate()"
                        class="w-full rounded-xl border border-slate-300 bg-white px-3.5 py-2.5 text-sm font-bold text-slate-900 focus:border-orange-500 focus:outline-none">
                        <option value="0">0% (без запаса)</option>
                        <option value="5">5%</option>
                        <option value="10" selected>10% (обычный запас)</option>
                        <option value="15">15%</option>
                    </select>
                </div>
            </div>

            <!-- Блок окон и дверей только для стенки -->
            <div id="wallOpeningsBox" class="mt-5 pt-4 border-t border-slate-100 space-y-3">
                <div class="flex flex-wrap items-center justify-between gap-2">
                    <span class="text-xs font-extrabold uppercase tracking-wider text-slate-600">Окна и двери на стенке (не входят в площадь работы)</span>
                    <div class="flex gap-2">
                        <button type="button" onclick="addOpening('window')"
                            class="px-3 py-1.5 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-800 text-xs font-bold transition cursor-pointer">
                            + Окно
                        </button>
                        <button type="button" onclick="addOpening('door')"
                            class="px-3 py-1.5 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-800 text-xs font-bold transition cursor-pointer">
                            + Дверь
                        </button>
                    </div>
                </div>

                <div id="openingsContainer" class="space-y-2.5"></div>
            </div>

            <div class="mt-4 pt-3.5 border-t border-slate-100 flex items-center justify-between text-xs sm:text-sm">
                <span id="areaLabel" class="text-slate-500 font-semibold">Итоговая площадь стенки:</span>
                <span id="areaDisplay" class="font-black text-slate-900">10.80 м²</span>
            </div>
        </section>

        <!-- ШАГ 2: ЧТО ДЕЛАЕМ (ОТДЕЛЬНЫЕ БЛОКИ ПО ЭТАПАМ) -->
        <section class="bg-white rounded-2xl p-5 sm:p-6 shadow-sm border border-slate-200">
            <h2 id="step2Title" class="text-base sm:text-lg font-extrabold text-slate-900 mb-4">2. Выберите этап / блок работы</h2>

            <div id="actionsGrid" class="grid grid-cols-1 sm:grid-cols-2 gap-3"></div>

            <!-- Параметры отдельных блоков -->
            <div id="optElectrical" class="hidden mt-4 pt-4 border-t border-slate-100 grid grid-cols-1 sm:grid-cols-3 gap-3">
                <div>
                    <label for="elecPoints" class="block text-xs font-bold text-slate-600 mb-1.5">Розетки и выключатели (шт.)</label>
                    <input type="number" id="elecPoints" value="4" min="1" max="50" step="1" oninput="calculate()"
                        class="w-full rounded-xl border border-slate-300 px-3 py-2 text-sm font-bold text-slate-900 focus:border-orange-500 focus:outline-none">
                </div>
                <div>
                    <label for="elecLights" class="block text-xs font-bold text-slate-600 mb-1.5">Точки освещения (шт.)</label>
                    <input type="number" id="elecLights" value="1" min="0" max="30" step="1" oninput="calculate()"
                        class="w-full rounded-xl border border-slate-300 px-3 py-2 text-sm font-bold text-slate-900 focus:border-orange-500 focus:outline-none">
                </div>
                <div>
                    <label for="elecChaseM" class="block text-xs font-bold text-slate-600 mb-1.5">Длина
